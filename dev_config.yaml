    "llm_requests_hanging": "https://open.feishu.cn/open-apis/bot/v2/hook/d120534f-40dc-4c63-b02e-4f9ef92bab8f",
    "budget_alerts": "https://open.feishu.cn/open-apis/bot/v2/hook/d120534f-40dc-4c63-b02e-4f9ef92bab8f",
    "db_exceptions": "https://open.feishu.cn/open-apis/bot/v2/hook/d120534f-40dc-4c63-b02e-4f9ef92bab8f",
    "daily_reports": "https://open.feishu.cn/open-apis/bot/v2/hook/d120534f-40dc-4c63-b02e-4f9ef92bab8f",
